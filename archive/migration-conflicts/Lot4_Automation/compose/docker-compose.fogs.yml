name: ${COMPOSE_PROJECT_NAME:-lot4-physical-fogs}
services:
  fog-a:
    profiles: [fog-a]
    build: {context: ../../Real-Time-Predictive-Maintenance, dockerfile: Dockerfile}
    image: lot4-physical-fog:local
    container_name: ${COMPOSE_PROJECT_NAME:-lot4-physical}-fog-a
    restart: unless-stopped
    command: [uvicorn, fog_nodes.fog_a.main:app, --host, 0.0.0.0, --port, "8001"]
    ports: ["${FOG_A_PORT:-8101}:8001"]
    environment:
      MQTT_BROKER_HOST: ${CENTRAL_IP:?Set CENTRAL_IP}
      MQTT_BROKER_PORT: "${MQTT_PORT:-1883}"
      FOG_FOG_ID: fog-a
      FOG_ZONE: A
      FOG_PORT: "8001"
      PYTHONPATH: /app:/app/mp1-simulator
    volumes: [../../mp1-simulator:/app/mp1-simulator:ro]
    networks: [lot4_fogs]
  fog-b:
    profiles: [fog-b]
    build: {context: ../../Real-Time-Predictive-Maintenance, dockerfile: Dockerfile}
    image: lot4-physical-fog:local
    container_name: ${COMPOSE_PROJECT_NAME:-lot4-physical}-fog-b
    restart: unless-stopped
    command: [uvicorn, fog_nodes.fog_b.main:app, --host, 0.0.0.0, --port, "8002"]
    ports: ["${FOG_B_PORT:-8102}:8002"]
    environment:
      MQTT_BROKER_HOST: ${CENTRAL_IP:?Set CENTRAL_IP}
      MQTT_BROKER_PORT: "${MQTT_PORT:-1883}"
      FOG_FOG_ID: fog-b
      FOG_ZONE: B
      FOG_PORT: "8002"
      PYTHONPATH: /app:/app/mp1-simulator
    volumes: [../../mp1-simulator:/app/mp1-simulator:ro]
    networks: [lot4_fogs]
  fog-c:
    profiles: [fog-c]
    build: {context: ../../Real-Time-Predictive-Maintenance, dockerfile: Dockerfile}
    image: lot4-physical-fog:local
    container_name: ${COMPOSE_PROJECT_NAME:-lot4-physical}-fog-c
    restart: unless-stopped
    command: [uvicorn, fog_nodes.fog_c.main:app, --host, 0.0.0.0, --port, "8003"]
    ports: ["${FOG_C_PORT:-8103}:8003"]
    environment:
      MQTT_BROKER_HOST: ${CENTRAL_IP:?Set CENTRAL_IP}
      MQTT_BROKER_PORT: "${MQTT_PORT:-1883}"
      FOG_FOG_ID: fog-c
      FOG_ZONE: C
      FOG_PORT: "8003"
      PYTHONPATH: /app:/app/mp1-simulator
    volumes: [../../mp1-simulator:/app/mp1-simulator:ro]
    networks: [lot4_fogs]
networks:
  lot4_fogs:
    name: ${COMPOSE_PROJECT_NAME:-lot4-physical-fogs}-network
    driver: bridge
