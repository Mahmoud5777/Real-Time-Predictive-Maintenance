# ==============================================================================
# Configuration Compose du Dashboard MP4 API-only connecté au backend MP3.
# ==============================================================================

services:
  mp4-dashboard:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: mp4-dashboard:api
    container_name: mp4-dashboard-api
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - ./nginx/nginx.api.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    environment:
      - NODE_ENV=production
    networks:
      - mp3-cloud_default

networks:
  mp3-cloud_default:
    name: mp3-cloud_default
    external: true
