services:
  mp4-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_DATA_SOURCE: "mock"
    image: mp4-dashboard:latest
    container_name: mp4-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    environment:
      - NODE_ENV=production
    networks:
      - mp4-network

networks:
  mp4-network:
    name: mp4-network
    driver: bridge
