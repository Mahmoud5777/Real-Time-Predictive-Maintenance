name: MP4 CI

on:
  push:
    paths:
      - "projects/mp4/frontend/**"
      - "projects/mp4/.github/workflows/**"
      - ".github/workflows/mp4-ci.yml"
  pull_request:
    paths:
      - "projects/mp4/frontend/**"
      - "projects/mp4/.github/workflows/**"
      - ".github/workflows/mp4-ci.yml"
  workflow_dispatch:

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/mp4/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/mp4/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Oxlint
        run: npm run lint

      - name: Build React application
        run: npm run build
