services:
  sim-mosquitto:
    image: eclipse-mosquitto:2
    container_name: lot4-sim-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1885:1883"
    volumes:
      - ../mqtt-sim/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - lot4-sim-network

  sim-fog-a:
    image: mp2-predictive-maintenance:latest
    build:
      context: ../../../../projects/mp2
      dockerfile: Dockerfile
    container_name: mp2-fog-a-lan-sim
    restart: unless-stopped
    command: uvicorn fog_nodes.fog_a.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8201:8001"
    environment:
      MQTT_BROKER_HOST: lot4-sim-mosquitto
      MQTT_BROKER_PORT: "1883"
      FOG_FOG_ID: fog-a
      FOG_ZONE: A
      FOG_PORT: 8001
      PYTHONPATH: /app:/app/mp1-simulator
    networks:
      - lot4-sim-network
    volumes:
      - ../../../../projects/mp1/simulator:/app/mp1-simulator:ro
    depends_on:
      - sim-mosquitto

  sim-fog-b:
    image: mp2-predictive-maintenance:latest
    build:
      context: ../../../../projects/mp2
      dockerfile: Dockerfile
    container_name: mp2-fog-b-lan-sim
    restart: unless-stopped
    command: uvicorn fog_nodes.fog_b.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8202:8002"
    environment:
      MQTT_BROKER_HOST: lot4-sim-mosquitto
      MQTT_BROKER_PORT: "1883"
      FOG_FOG_ID: fog-b
      FOG_ZONE: B
      FOG_PORT: 8002
      PYTHONPATH: /app:/app/mp1-simulator
    networks:
      - lot4-sim-network
    volumes:
      - ../../../../projects/mp1/simulator:/app/mp1-simulator:ro
    depends_on:
      - sim-mosquitto

  sim-fog-c:
    image: mp2-predictive-maintenance:latest
    build:
      context: ../../../../projects/mp2
      dockerfile: Dockerfile
    container_name: mp2-fog-c-lan-sim
    restart: unless-stopped
    command: uvicorn fog_nodes.fog_c.main:app --host 0.0.0.0 --port 8003
    ports:
      - "8203:8003"
    environment:
      MQTT_BROKER_HOST: lot4-sim-mosquitto
      MQTT_BROKER_PORT: "1883"
      FOG_FOG_ID: fog-c
      FOG_ZONE: C
      FOG_PORT: 8003
      PYTHONPATH: /app:/app/mp1-simulator
    networks:
      - lot4-sim-network
    volumes:
      - ../../../../projects/mp1/simulator:/app/mp1-simulator:ro
    depends_on:
      - sim-mosquitto

networks:
  lot4-sim-network:
    external: true
    name: lot4-sim-network
