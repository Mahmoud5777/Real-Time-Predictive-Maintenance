services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fog}
      POSTGRES_DB: ${POSTGRES_DB:-fog_cloud}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fog} -d ${POSTGRES_DB:-fog_cloud}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ../infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  api:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "${API_PORT:-8000}:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  ingest:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    command: python -m app.ingest.worker
    restart: unless-stopped

volumes:
  pgdata:
