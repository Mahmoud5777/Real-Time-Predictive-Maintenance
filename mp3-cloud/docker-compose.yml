services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fog}
      POSTGRES_DB: ${POSTGRES_DB:-fog_cloud}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fog} -d ${POSTGRES_DB:-fog_cloud}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ../infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqttdata:/mosquitto/data

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fog}:${POSTGRES_PASSWORD:-fog}@db:5432/${POSTGRES_DB:-fog_cloud}
      MQTT_HOST: mosquitto
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "${API_PORT:-8000}:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  ingest:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fog}:${POSTGRES_PASSWORD:-fog}@db:5432/${POSTGRES_DB:-fog_cloud}
      MQTT_HOST: mosquitto
      MQTT_METRICS_HOST: 0.0.0.0
      MQTT_METRICS_PORT: 8001
    ports:
      - "127.0.0.1:${MQTT_METRICS_PORT:-8001}:8001"
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    command: python -m app.ingest.worker
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; data = urllib.request.urlopen('http://127.0.0.1:8001/metrics', timeout=2).read(); assert b'fog_cloud_mqtt_ready 1.0' in data"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
  mqttdata:
