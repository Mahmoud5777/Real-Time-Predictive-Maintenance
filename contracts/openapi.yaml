components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    MachineId:
      name: machineId
      in: path
      required: true
      schema:
        type: string
        pattern: ^M(0[1-9]|1[0-2])$
    MachineIdQ:
      name: machine_id
      in: query
      schema:
        type: string
    AlertId:
      name: alertId
      in: path
      required: true
      schema:
        type: string
    Zone:
      name: zone
      in: query
      schema:
        type: string
        enum:
        - A
        - B
        - C
    From:
      name: from
      in: query
      description: Borne basse inclusive, ISO-8601 UTC
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    Sort:
      name: sort
      in: query
      description: Champ precede de - pour un tri descendant
      schema:
        type: string
        default: -timestamp
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    AnomalyOnly:
      name: anomaly
      in: query
      schema:
        type: boolean
  responses:
    Problem:
      description: Erreur normalisee RFC 7807
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Ressource inconnue
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Token absent ou invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    BatchRequest:
      type: object
      required:
      - messages
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: object
            required:
            - kind
            - payload
            properties:
              kind:
                type: string
                enum:
                - sensor
                - prediction
                - alert
                - fog_status
                - task_event
              payload:
                type: object
    BatchReport:
      type: object
      required:
      - accepted
      - duplicates
      - rejected
      - errors
      properties:
        accepted:
          type: integer
          minimum: 0
          description: Messages nouvellement enregistres apres commit
        duplicates:
          type: integer
          minimum: 0
          description: Retransmissions identiques sans nouvel effet
        rejected:
          type: integer
          minimum: 0
          description: Erreurs de validation ou de coherence isolees
        errors:
          type: array
          items:
            type: object
            required:
            - index
            - code
            - detail
            properties:
              index:
                type: integer
                minimum: 0
              code:
                type: string
              detail:
                type: string
    BatchRejected:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - $ref: '#/components/schemas/BatchReport'
      - type: object
        required:
        - code
        properties:
          code:
            type: string
            enum:
            - NO_VALID_MESSAGE
    RequestValidationError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: array
          items:
            type: object
    IngestUnauthorized:
      type: object
      required:
      - detail
      properties:
        detail:
          type: object
          required:
          - type
          - title
          properties:
            type:
              type: string
            title:
              type: string
    PageMeta:
      properties:
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
        total:
          type: integer
          title: Total
      type: object
      required:
      - limit
      - offset
      - total
      title: PageMeta
    Machine:
      type: object
      properties:
        machine_id:
          type: string
        name:
          type: string
        machine_type:
          type: string
        zone:
          type: string
        fog_id:
          type: string
    MachinePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Machine'
        meta:
          $ref: '#/components/schemas/PageMeta'
    SensorData:
      type: object
