openapi: 3.0.3
info:
  title: FOG Cloud API (MP3)
  version: 0.1.0
  description: 'Contrat MP3 : les lectures marquees implemented correspondent a l''API FastAPI. Les operations
    marquees planned sont une feuille de route, pas des routes disponibles. Lectures publiques pour la
    demonstration locale ; ingestion protegee par bearer token.'
servers:
- url: http://localhost:8000/api/v1
security:
- BearerAuth: []
tags:
- name: ingest
- name: machines
- name: measurements
- name: predictions
- name: alerts
- name: fog
- name: tasks
- name: analytics
paths:
  /ingest/batch:
    post:
      tags:
      - ingest
      summary: Ingestion HTTP de secours (seed, tests, rejeu)
      description: 'Ecritures confirmees par transaction. Les erreurs metier sont isolees par element.
        Une retransmission identique est un doublon sans effet ; reutiliser le meme message_id avec un
        autre contenu est rejete. Un lot de doublons seuls recoit 207.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
      responses:
        '207':
          description: Lot confirme avec au moins une insertion ou un doublon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchReport'
        '401':
          description: Token absent ou invalide, reponse existante de la dependance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestUnauthorized'
        '422':
          description: Tous les messages rejetes ou enveloppe FastAPI invalide
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/BatchRejected'
                - $ref: '#/components/schemas/RequestValidationError'
        '503':
          description: Transaction non confirmee, sans compteur de succes ; rejeu avec les memes identifiants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/Problem'
      x-implementation-status: implemented
